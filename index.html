<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JHS Bulldogs — Practice Schedule</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
  :root {
    --bg:#1a1b1e; --bg2:#25262b; --bg3:#2c2e33;
    --border:#3a3d44; --text:#e8e9ec; --text2:#a0a4ad; --text3:#6b6f7a;
    --accent:#378ADD;
    --font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:var(--font); min-height:100vh; padding:1.5rem; }
  .wrap { max-width:860px; margin:0 auto; }

  .top-bar { display:flex; align-items:center; gap:12px; margin-bottom:1.5rem; padding-bottom:1rem; border-bottom:1px solid var(--border); }
  .logo-img { width:52px; height:52px; object-fit:contain; flex-shrink:0; mix-blend-mode:screen; }
  .top-bar h1 { font-size:19px; font-weight:600; color:var(--text); }
  .top-bar p  { font-size:13px; color:var(--text2); margin-top:2px; }

  .top-bar-right { display:flex; align-items:center; gap:8px; margin-left:auto; flex-shrink:0; }
  .export-btn, .print-btn {
    font-size:13px; padding:6px 13px;
    border:1px solid var(--border); border-radius:8px;
    background:var(--bg2); color:var(--text); cursor:pointer;
    display:flex; align-items:center; gap:6px;
  }
  .export-btn:hover, .print-btn:hover { background:var(--bg3); }
  .export-btn { background:#1e5fa8; border-color:#2a72c4; }
  .export-btn:hover { background:#2470c0; }

  /* PRINT MODE PICKER MODAL */
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.65); z-index:100; display:none; align-items:center; justify-content:center; }
  .modal-overlay.open { display:flex; }
  .modal { background:var(--bg2); border:1px solid var(--border); border-radius:14px; padding:1.5rem; width:340px; max-width:90vw; }
  .modal h2 { font-size:16px; font-weight:600; color:var(--text); margin-bottom:.4rem; }
  .modal p  { font-size:13px; color:var(--text2); margin-bottom:1.2rem; }
  .mode-options { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:1.2rem; }
  .mode-card {
    border:2px solid var(--border); border-radius:10px; padding:14px 12px;
    cursor:pointer; text-align:center; transition:border-color .15s;
  }
  .mode-card:hover { border-color:var(--accent); }
  .mode-card.selected { border-color:var(--accent); background:rgba(55,138,221,.1); }
  .mode-card .mc-icon { font-size:26px; margin-bottom:6px; }
  .mode-card .mc-label { font-size:13px; font-weight:600; color:var(--text); }
  .mode-card .mc-sub   { font-size:11px; color:var(--text2); margin-top:2px; }
  .modal-actions { display:flex; gap:8px; justify-content:flex-end; }
  .btn-cancel { font-size:13px; padding:6px 14px; border:1px solid var(--border); border-radius:8px; background:transparent; color:var(--text2); cursor:pointer; }
  .btn-cancel:hover { background:var(--bg3); }
  .btn-print-go { font-size:13px; padding:6px 14px; border:none; border-radius:8px; background:#1e5fa8; color:#fff; cursor:pointer; }
  .btn-print-go:hover { background:#2470c0; }

  /* LIGHT PRINT OVERRIDES injected dynamically */

  .meta-row { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:1rem; }
  .df { display:flex; flex-direction:column; gap:3px; }
  .df label { font-size:11px; color:var(--text2); font-weight:500; text-transform:uppercase; letter-spacing:.05em; }
  .df input, .df select { font-size:13px; padding:6px 10px; border:1px solid var(--border); border-radius:8px; background:var(--bg2); color:var(--text); }
  .df input:focus, .df select:focus { outline:none; border-color:var(--accent); }

  .pt-row { display:flex; align-items:flex-end; gap:10px; flex-wrap:wrap; padding:10px 14px; background:var(--bg2); border:1px solid var(--border); border-radius:12px; margin-bottom:1rem; }
  .pt-row label { font-size:11px; color:var(--text2); font-weight:500; text-transform:uppercase; letter-spacing:.05em; display:block; margin-bottom:3px; }
  .pt-row input[type=time] { font-size:13px; padding:6px 10px; border:1px solid var(--border); border-radius:8px; background:var(--bg3); color:var(--text); }
  .pt-row input[type=time]:focus { outline:none; border-color:var(--accent); }
  .sep { font-size:15px; color:var(--text3); padding-bottom:6px; }
  .time-summary { font-size:12px; color:var(--text2); padding-bottom:6px; margin-left:4px; }

  .warning-bar { font-size:12px; color:#e07070; background:#2e1a1a; border:1px solid #6b2a2a; border-radius:8px; padding:7px 12px; margin-bottom:10px; display:none; gap:7px; align-items:center; }

  .add-row { display:flex; gap:8px; align-items:center; margin-bottom:1.25rem; flex-wrap:wrap; }
  .add-row select, .add-row input { font-size:13px; padding:6px 10px; border:1px solid var(--border); border-radius:8px; background:var(--bg2); color:var(--text); }
  .add-row select:focus, .add-row input:focus { outline:none; border-color:var(--accent); }
  .add-row button { font-size:13px; padding:6px 13px; border:1px solid var(--border); border-radius:8px; background:var(--bg2); color:var(--text); cursor:pointer; display:flex; align-items:center; gap:5px; }
  .add-row button:hover { background:var(--bg3); }

  #blocks-container { display:flex; flex-direction:column; gap:9px; }
  .block { border:1px solid var(--border); border-radius:12px; overflow:hidden; transition:opacity .15s; }
  .block.dragging { opacity:.35; }
  .block.drag-over { outline:2px solid var(--accent); }

  .bh { display:flex; align-items:center; gap:8px; padding:8px 11px; border-bottom:1px solid rgba(0,0,0,.3); }
  .drag-handle { cursor:grab; font-size:17px; flex-shrink:0; color:#fff; opacity:.7; }
  .drag-handle:active { cursor:grabbing; }
  .block-title-input { font-size:13px; font-weight:600; background:transparent; border:none; outline:none; min-width:0; flex:1; color:#fff; }
  .block-title-input::placeholder { color:rgba(255,255,255,.5); }
  .block-title-input:focus { background:rgba(255,255,255,.1); border-radius:4px; padding:1px 5px; }
  .min-wrap { display:flex; align-items:center; gap:3px; flex-shrink:0; }
  .min-wrap input[type=number] { width:48px; font-size:12px; padding:2px 5px; border:1px solid rgba(255,255,255,.25); border-radius:6px; background:rgba(255,255,255,.15); color:#fff; text-align:center; }
  .min-wrap input[type=number]:focus { outline:none; border-color:rgba(255,255,255,.6); }
  .min-wrap span { font-size:11px; color:#fff; opacity:.8; }
  .calc-times { font-size:11px; color:#fff; opacity:.75; flex-shrink:0; white-space:nowrap; }
  .bh-actions { display:flex; align-items:center; gap:3px; flex-shrink:0; }
  .icon-btn { background:transparent; border:none; cursor:pointer; padding:3px; border-radius:5px; display:flex; align-items:center; font-size:15px; color:#fff; opacity:.7; }
  .icon-btn:hover { opacity:1; background:rgba(255,255,255,.15); }
  .color-swatch { width:19px; height:19px; border-radius:50%; border:2px solid rgba(255,255,255,.4); cursor:pointer; flex-shrink:0; padding:0; }

  .bb { padding:11px 13px; background:var(--bg2); }
  .notes-lbl { font-size:11px; color:var(--text2); margin-bottom:4px; }
  .bb textarea { font-size:12px; resize:vertical; min-height:44px; border:1px solid var(--border); border-radius:8px; padding:7px 10px; background:var(--bg3); color:var(--text); font-family:var(--font); width:100%; }
  .bb textarea:focus { outline:none; border-color:var(--accent); }

  .groups-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:8px; margin-bottom:9px; }
  .gc { border:1px solid var(--border); border-radius:8px; overflow:hidden; }
  .gc-hdr { padding:5px 9px; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  .gc-hdr input { font-size:11px; font-weight:600; border:none; outline:none; background:transparent; color:#fff; width:100%; padding:0; }
  .gc-hdr input::placeholder { color:rgba(255,255,255,.5); }
  .gc textarea { font-size:12px; resize:vertical; min-height:52px; border:none; border-top:1px solid var(--border); padding:6px 9px; background:var(--bg3); color:var(--text); font-family:var(--font); width:100%; }
  .gc textarea:focus { outline:none; }

  /* BASE PRINT — always hide UI chrome */
  @media print {
    .add-row, .top-bar-right, .drag-handle, .icon-btn, .color-swatch, .min-wrap, .modal-overlay, .warning-bar { display:none !important; }
    .block { break-inside:avoid; }
    .bh { -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; }
    .gc-hdr { -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; }
  }

  /* DARK PRINT — force dark colors into print output */
  @media print {
    html.print-dark body { background:#1a1b1e !important; color:#e8e9ec !important; -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; }
    html.print-dark .wrap, html.print-dark .bb { background:#25262b !important; }
    html.print-dark .block { border-color:#3a3d44 !important; background:#1a1b1e !important; }
    html.print-dark .bb textarea, html.print-dark .gc textarea { background:#2c2e33 !important; color:#e8e9ec !important; border-color:#3a3d44 !important; }
    html.print-dark .pt-row { background:#25262b !important; border-color:#3a3d44 !important; }
    html.print-dark .notes-lbl { color:#a0a4ad !important; }
    html.print-dark .time-summary { color:#a0a4ad !important; }
    html.print-dark .top-bar, html.print-dark .meta-row .df input, html.print-dark .meta-row .df select { background:#25262b !important; color:#e8e9ec !important; border-color:#3a3d44 !important; }
  }

  /* LIGHT PRINT — clean white output */
  @media print {
    html.print-light body { background:#fff !important; color:#111 !important; }
    html.print-light .wrap, html.print-light .bb { background:#fff !important; }
    html.print-light .block { border-color:#ccc !important; }
    html.print-light .bb textarea, html.print-light .gc textarea { background:#fff !important; color:#111 !important; border-color:#ccc !important; }
    html.print-light .pt-row { background:#f0f0f0 !important; border-color:#ccc !important; }
    html.print-light .notes-lbl { color:#555 !important; }
    html.print-light .time-summary { color:#555 !important; }
    html.print-light .top-bar { border-color:#ccc !important; }
    html.print-light .logo-img { mix-blend-mode:multiply; }
  }
</style>
</head>

  </div>

  <div class="warning-bar" id="warning-bar">
    <i class="ti ti-alert-triangle"></i>
    <span id="warning-msg"></span>
  </div>

  <div class="add-row">
    <select id="block-type-sel" onchange="handleTypeChange()">
      <option value="">— Add a block —</option>
      <optgroup label="Core blocks">
        <option value="stretch">Stretch</option>
        <option value="cals">Calisthenics</option>
        <option value="def-ind">Defensive — individual</option>
        <option value="team-def">Team defense</option>
        <option value="off-ind">Offensive — individual</option>
        <option value="team-off">Team offense</option>
        <option value="wrap">Wrap-up / team huddle</option>
      </optgroup>
      <optgroup label="Additional">
        <option value="conditioning">Conditioning</option>
        <option value="special-teams">Special teams</option>
        <option value="water">Water break</option>
        <option value="film">Film review</option>
        <option value="custom">Custom...</option>
      </optgroup>
    </select>
    <input type="text" id="custom-name" placeholder="Block name..." style="display:none;min-width:140px;">
    <button onclick="addBlock()"><i class="ti ti-plus"></i> Add block</button>
  </div>

  <div id="blocks-container"></div>
</div>

<script>
// ── LOGO (base64 embedded) ──────────────────────────────────────────────────
// Already set via src attribute above

// ── EXPORT MODAL ────────────────────────────────────────────────────────────
let selectedMode = 'dark';
function openExportModal(){ document.getElementById('export-modal').classList.add('open'); }
function closeExportModal(){ document.getElementById('export-modal').classList.remove('open'); }
function handleOverlayClick(e){ if(e.target===document.getElementById('export-modal')) closeExportModal(); }
function selectMode(mode){
  selectedMode = mode;
  document.getElementById('card-dark').classList.toggle('selected', mode==='dark');
  document.getElementById('card-light').classList.toggle('selected', mode==='light');
}
function doPrint(){
  closeExportModal();
  const html = document.documentElement;
  html.classList.remove('print-light','print-dark');
  if(selectedMode==='light') html.classList.add('print-light');
  else html.classList.add('print-dark');
  setTimeout(()=>{
    window.print();
    setTimeout(()=>{ html.classList.remove('print-light','print-dark'); }, 1500);
  }, 200);
}

// ── SCHEDULE LOGIC ──────────────────────────────────────────────────────────
const COLORS = {
  'stretch':'#555860','cals':'#555860','def-ind':'#1e5fa8','team-def':'#154080',
  'off-ind':'#3a7a14','team-off':'#275a0d','wrap':'#444750',
  'conditioning':'#b53030','special-teams':'#9a6010','water':'#107a58',
  'film':'#5a4fb5','custom':'#444750'
};
const TEMPLATES = {
  'stretch':      {title:'Stretch',                mins:10,type:'simple', ph:'e.g. Dynamic warm-up, high knees, hip openers...'},
  'cals':         {title:'Calisthenics',            mins:15,type:'simple', ph:'e.g. Jumping jacks, push-ups, burpees...'},
  'def-ind':      {title:'Defensive — individual', mins:25,type:'def-ind',ph:'Station rotations, coach assignments...'},
  'team-def':     {title:'Team defense',           mins:30,type:'simple', ph:'e.g. Base 4-3 vs run, 2-high shells, 3rd-down packages...'},
  'off-ind':      {title:'Offensive — individual', mins:25,type:'off-ind',ph:'Station rotations, JUGS machine, film takeaways...'},
  'team-off':     {title:'Team offense',           mins:20,type:'simple', ph:'e.g. Install RPO series, red zone script, 2-minute drill...'},
  'wrap':         {title:'Wrap-up / team huddle',  mins:10,type:'simple', ph:'Sprints, player of week, vision session, announcements...'},
  'conditioning': {title:'Conditioning',           mins:15,type:'simple', ph:'e.g. Sprints, gassers, agility ladders...'},
  'special-teams':{title:'Special teams',          mins:20,type:'st',     ph:''},
  'water':        {title:'Water break',            mins:5, type:'simple', ph:''},
  'film':         {title:'Film review',            mins:20,type:'simple', ph:'e.g. Last game takeaways, opponent scouting...'},
  'custom':       {title:'',                       mins:15,type:'simple', ph:'Notes...'},
};
const DEFAULT_ORDER=['stretch','cals','def-ind','team-def','off-ind','team-off','wrap'];
let dragSrc=null;

function fmtTime(m){const h=Math.floor(m/60)%24,mn=m%60,ampm=h<12?'AM':'PM',h12=h%12||12;return `${h12}:${String(mn).padStart(2,'0')} ${ampm}`;}
function toMins(t){const[h,m]=t.split(':').map(Number);return h*60+m;}

function recalc(){
  const blocks=[...document.querySelectorAll('#blocks-container .block')];
  const start=toMins(document.getElementById('pstart').value||'15:45');
  const end=toMins(document.getElementById('pend').value||'18:00');
  let cursor=start,total=0;
  blocks.forEach(bl=>{
    const mins=parseInt(bl.dataset.mins)||10;
    total+=mins;
    bl.querySelector('.calc-times').textContent=`${fmtTime(cursor)} → ${fmtTime(cursor+mins)}`;
    cursor+=mins;
  });
  document.getElementById('time-summary').textContent=`${total} min scheduled · ${end-start} min available`;
  const wb=document.getElementById('warning-bar');
  if(total>end-start){wb.style.display='flex';document.getElementById('warning-msg').textContent=`Schedule runs ${total-(end-start)} min over the ${fmtTime(end)} end time.`;}
  else wb.style.display='none';
}

function groupCards(groups){
  return `<div class="groups-grid">${groups.map(g=>`
    <div class="gc">
      <div class="gc-hdr" style="background:${g.bg};">
        <input type="text" value="${g.label}" placeholder="Group name" oninput="this.dataset.edited='1'">
      </div>
      <textarea placeholder="${g.ph}"></textarea>
    </div>`).join('')}</div>`;
}

function buildBlock(key,customTitle){
  const tmpl=TEMPLATES[key]||TEMPLATES['custom'];
  const title=customTitle||tmpl.title;
  const color=COLORS[key]||COLORS['custom'];
  const DEF=[{label:'Defensive backs',ph:'e.g. Press coverage, backpedal, zone drops...',bg:'#154080'},{label:'Defensive line',ph:'e.g. Get-off, hand fighting, pass rush moves...',bg:'#154080'},{label:'Linebackers',ph:'e.g. Keys, drop coverage, blitz assignments...',bg:'#154080'}];
  const OFF=[{label:'Quarterback',ph:'e.g. Footwork, reads, drop timing...',bg:'#275a0d'},{label:'Running back',ph:'e.g. Ball security, pass pro, route tree...',bg:'#275a0d'},{label:'Wide receivers',ph:'e.g. Release, route running, hands...',bg:'#275a0d'},{label:'Offensive line',ph:'e.g. Blocking angles, combo blocks, pass sets...',bg:'#275a0d'}];
  const ST=[{label:'Kick coverage',ph:'Lanes, contain, pursuit angles...',bg:'#6b4208'},{label:'Kick return',ph:'Blocking scheme, returner reads...',bg:'#6b4208'},{label:'Punt / punt return',ph:'Protection, coverage, return setup...',bg:'#6b4208'}];
  let body='';
  if(tmpl.type==='def-ind') body=`<div class="bb">${groupCards(DEF)}<div class="notes-lbl">Additional notes</div><textarea placeholder="${tmpl.ph}"></textarea></div>`;
  else if(tmpl.type==='off-ind') body=`<div class="bb">${groupCards(OFF)}<div class="notes-lbl">Additional notes</div><textarea placeholder="${tmpl.ph}"></textarea></div>`;
  else if(tmpl.type==='st') body=`<div class="bb">${groupCards(ST)}<div class="notes-lbl">Additional notes</div><textarea placeholder="Field goal team, PAT, fake calls..."></textarea></div>`;
  else body=`<div class="bb"><div class="notes-lbl">Notes</div><textarea placeholder="${tmpl.ph}"></textarea></div>`;

  const el=document.createElement('div');
  el.className='block'; el.dataset.mins=String(tmpl.mins); el.draggable=true;
  el.innerHTML=`
    <div class="bh" style="background:${color};">
      <span class="drag-handle"><i class="ti ti-grid-dots"></i></span>
      <input class="block-title-input" type="text" value="${title}" placeholder="Block name">
      <div class="min-wrap">
        <input type="number" min="1" max="240" value="${tmpl.mins}" oninput="this.closest('.block').dataset.mins=Math.max(1,parseInt(this.value)||1);recalc();">
        <span>min</span>
      </div>
      <span class="calc-times"></span>
      <div class="bh-actions">
        <input type="color" class="color-swatch" value="${color}" title="Header color" oninput="this.closest('.bh').style.background=this.value;">
        <button class="icon-btn" onclick="removeBlock(this)" title="Remove block"><i class="ti ti-trash"></i></button>
      </div>
    </div>${body}`;

  el.addEventListener('dragstart',e=>{dragSrc=el;el.classList.add('dragging');e.dataTransfer.effectAllowed='move';});
  el.addEventListener('dragend',()=>{el.classList.remove('dragging');document.querySelectorAll('.block').forEach(x=>x.classList.remove('drag-over'));recalc();});
  el.addEventListener('dragover',e=>{e.preventDefault();if(el!==dragSrc)el.classList.add('drag-over');});
  el.addEventListener('dragleave',()=>el.classList.remove('drag-over'));
  el.addEventListener('drop',e=>{
    e.preventDefault();el.classList.remove('drag-over');
    if(dragSrc&&dragSrc!==el){
      const cont=document.getElementById('blocks-container');
      const kids=[...cont.children],si=kids.indexOf(dragSrc),ti=kids.indexOf(el);
      si<ti?cont.insertBefore(dragSrc,el.nextSibling):cont.insertBefore(dragSrc,el);
      recalc();
    }
  });
  return el;
}

function removeBlock(btn){
  const bl=btn.closest('.block');
  if(confirm('Remove "'+bl.querySelector('.block-title-input').value+'"?')){bl.remove();recalc();}
}
function handleTypeChange(){
  document.getElementById('custom-name').style.display=document.getElementById('block-type-sel').value==='custom'?'block':'none';
}
function addBlock(){
  const sel=document.getElementById('block-type-sel'),ci=document.getElementById('custom-name'),val=sel.value;
  if(!val){alert('Choose a block type first.');return;}
  const customTitle=val==='custom'?ci.value.trim():'';
  if(val==='custom'&&!customTitle){ci.focus();return;}
  const cont=document.getElementById('blocks-container');
  cont.appendChild(buildBlock(val,customTitle));
  recalc();
  sel.value='';ci.value='';ci.style.display='none';
  cont.lastElementChild.scrollIntoView({behavior:'smooth',block:'nearest'});
}

(function init(){
  const today=new Date();
  document.getElementById('pdate').value=today.toISOString().slice(0,10);
  const days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const sel=document.getElementById('pday');
  for(let i=0;i<sel.options.length;i++){if(sel.options[i].value===days[today.getDay()]){sel.selectedIndex=i;break;}}
  document.getElementById('pstart').addEventListener('change',recalc);
  document.getElementById('pend').addEventListener('change',recalc);
  const cont=document.getElementById('blocks-container');
  DEFAULT_ORDER.forEach(k=>cont.appendChild(buildBlock(k)));
  recalc();
})();
</script>
</body>
</html>
